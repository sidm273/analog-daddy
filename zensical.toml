[project]
site_name = "Analog Daddy"
site_description = "An attempt to make transistor sizing for Analog Design less painful."
site_author = "Sid"
site_url = "https://siddhantladdha.github.io/analog_daddy/"
repo_url = "https://github.com/siddhantladdha/analog_daddy"
repo_name = "siddhantladdha/analog_daddy"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.top",
  "navigation.path",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.footer",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/siddhantladdha/analog-daddy"

[project.plugins.api-autonav]
modules = ["src/analog_daddy"]
api_root_uri = "api"
exclude_private = false
exclude = ["re:src/analog_daddy/\\.*drafts\\.*"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"

[project.plugins.llmstxt]

[project.plugins.autorefs]
