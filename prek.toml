# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-toml" },
  { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.4"  # Ruff version.
hooks = [
  # Run the linter.
  { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },

  # Run the formatter.
  { id = "ruff-format", types_or = ["python", "pyi", "markdown"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "format-docstring",
    name = "Format docstrings",
    entry = "uv run format-docstring",
    language = "system",
    types = ["python"],
  },
  {
    id = "pydoclint",
    name = "Pydoclint",
    entry = "uv run --with pydoclint pydoclint",
    language = "system",
    types = ["python"],
  },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.99"  # ty version.
hooks = [
  { id = "ty" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "complexipy",
    name = "Run the complexipy lint check",
    entry = "uv run complexipy --max-complexity-allowed 5",
    language = "system",
    types = ["python"],
  },
]
